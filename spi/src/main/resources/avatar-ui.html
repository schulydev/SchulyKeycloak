<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Profile picture &middot; Schuly</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: #0a0a0a; color: #fafafa; padding: 24px;
  }
  .card {
    width: 100%; max-width: 420px; background: #131313; border: 1px solid #262626;
    border-radius: 16px; padding: 28px; text-align: center;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { color: #a3a3a3; font-size: 14px; margin: 0 0 24px; }
  .avatar {
    width: 128px; height: 128px; border-radius: 50%; object-fit: cover;
    background: #1f1f1f; border: 1px solid #333; margin: 0 auto 20px; display: block;
  }
  .avatar.placeholder { display: flex; align-items: center; justify-content: center; color: #555; font-size: 40px; }
  button, label.btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 12px 16px; border-radius: 10px; border: 1px solid #333;
    font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 10px; background: #1c1c1c; color: #fafafa;
  }
  button.primary { background: #fafafa; color: #0a0a0a; border-color: #fafafa; }
  button.danger { color: #f87171; border-color: #7f1d1d; background: transparent; }
  button:disabled { opacity: .5; cursor: default; }
  input[type=file] { display: none; }
  .msg { margin-top: 16px; font-size: 14px; min-height: 20px; }
  .msg.err { color: #f87171; }
  .msg.ok { color: #4ade80; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="card">
    <h1>Profile picture</h1>
    <p class="sub">Upload a picture for your Schuly account.</p>
    <img id="avatar" class="avatar placeholder" alt="avatar"/>
    <div id="ui" class="hidden">
      <label class="btn" for="file">Choose a picture</label>
      <input type="file" id="file" accept="image/png,image/jpeg,image/webp"/>
      <button id="save" class="primary hidden">Save picture</button>
      <button id="remove" class="danger hidden">Remove picture</button>
      <div id="msg" class="msg"></div>
    </div>
    <div id="loading" class="msg">Loading&hellip;</div>
  </div>

<script>
(function () {
  var REALM_URL = "${realmUrl}";       // e.g. http://host/realms/schuly
  var CLIENT_ID = "${clientId}";       // schuly-avatar
  var REDIRECT = location.origin + location.pathname; // this page, no query
  var MAX_BYTES = 1024 * 1024;

  var $ = function (id) { return document.getElementById(id); };
  var token = null, userId = null, pendingData = null, pendingType = null;

  function b64url(bytes) {
    var s = btoa(String.fromCharCode.apply(null, new Uint8Array(bytes)));
    return s.replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function randomVerifier() {
    var a = new Uint8Array(32); crypto.getRandomValues(a); return b64url(a);
  }
  // Pure-JS SHA-256 (bytes -> Uint8Array). crypto.subtle is only defined in a
  // secure context (https / localhost), so a self-hosted http deployment can't
  // use it for the PKCE challenge — this keeps S256 working over plain http.
  function sha256(bytes) {
    var K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
    var H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
    var l = bytes.length, withOne = l + 1, pad = (56 - withOne % 64 + 64) % 64, total = withOne + pad + 8;
    var m = new Uint8Array(total); m.set(bytes); m[l] = 0x80;
    var dv = new DataView(m.buffer); var bits = l * 8;
    dv.setUint32(total - 4, bits >>> 0); dv.setUint32(total - 8, Math.floor(bits / 0x100000000));
    function rotr(x, n) { return (x >>> n) | (x << (32 - n)); }
    var w = new Uint32Array(64);
    for (var off = 0; off < total; off += 64) {
      for (var i = 0; i < 16; i++) w[i] = dv.getUint32(off + i * 4);
      for (var i = 16; i < 64; i++) {
        var s0 = rotr(w[i-15],7) ^ rotr(w[i-15],18) ^ (w[i-15] >>> 3);
        var s1 = rotr(w[i-2],17) ^ rotr(w[i-2],19) ^ (w[i-2] >>> 10);
        w[i] = (w[i-16] + s0 + w[i-7] + s1) >>> 0;
      }
      var a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
      for (var i = 0; i < 64; i++) {
        var S1 = rotr(e,6) ^ rotr(e,11) ^ rotr(e,25), chh = (e & f) ^ (~e & g);
        var t1 = (h + S1 + chh + K[i] + w[i]) >>> 0;
        var S0 = rotr(a,2) ^ rotr(a,13) ^ rotr(a,22), maj = (a & b) ^ (a & c) ^ (b & c);
        var t2 = (S0 + maj) >>> 0;
        h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
      }
      H[0]=(H[0]+a)>>>0; H[1]=(H[1]+b)>>>0; H[2]=(H[2]+c)>>>0; H[3]=(H[3]+d)>>>0;
      H[4]=(H[4]+e)>>>0; H[5]=(H[5]+f)>>>0; H[6]=(H[6]+g)>>>0; H[7]=(H[7]+h)>>>0;
    }
    var out = new Uint8Array(32), odv = new DataView(out.buffer);
    for (var i = 0; i < 8; i++) odv.setUint32(i * 4, H[i]);
    return out;
  }
  function challenge(verifier) { return b64url(sha256(new TextEncoder().encode(verifier))); }
  function decodeSub(jwt) {
    try { return JSON.parse(atob(jwt.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))).sub; }
    catch (e) { return null; }
  }
  function show(el, on) { el.classList.toggle("hidden", !on); }
  function setMsg(text, cls) { var m = $("msg"); m.textContent = text || ""; m.className = "msg " + (cls || ""); }

  async function login() {
    var verifier = randomVerifier();
    sessionStorage.setItem("av_verifier", verifier);
    var url = REALM_URL + "/protocol/openid-connect/auth"
      + "?client_id=" + encodeURIComponent(CLIENT_ID)
      + "&redirect_uri=" + encodeURIComponent(REDIRECT)
      + "&response_type=code&scope=" + encodeURIComponent("openid profile")
      + "&code_challenge=" + (await challenge(verifier)) + "&code_challenge_method=S256";
    location.replace(url);
  }
  async function exchange(code) {
    var verifier = sessionStorage.getItem("av_verifier");
    var body = new URLSearchParams({
      grant_type: "authorization_code", code: code, client_id: CLIENT_ID,
      redirect_uri: REDIRECT, code_verifier: verifier || ""
    });
    var r = await fetch(REALM_URL + "/protocol/openid-connect/token", {
      method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: body
    });
    if (!r.ok) throw new Error("token exchange failed");
    var j = await r.json();
    return j.access_token;
  }

  function refreshAvatar(bust) {
    var img = $("avatar");
    img.onload = function () { img.classList.remove("placeholder"); img.textContent = ""; };
    img.onerror = function () { img.removeAttribute("src"); img.classList.add("placeholder"); img.textContent = "?"; show($("remove"), false); };
    img.src = REALM_URL + "/avatar/" + userId + "?b=" + (bust || Date.now());
  }

  $("file").addEventListener("change", function (e) {
    var f = e.target.files[0];
    if (!f) return;
    if (f.size > MAX_BYTES) { setMsg("Image is too large (max 1 MB).", "err"); return; }
    var reader = new FileReader();
    reader.onload = function () {
      $("avatar").src = reader.result; $("avatar").classList.remove("placeholder"); $("avatar").textContent = "";
      pendingData = reader.result.split(",")[1]; pendingType = f.type || "image/png";
      show($("save"), true); setMsg("");
    };
    reader.readAsDataURL(f);
  });

  $("save").addEventListener("click", async function () {
    if (!pendingData) return;
    $("save").disabled = true; setMsg("Saving…");
    try {
      var r = await fetch(REALM_URL + "/avatar/me", {
        method: "PUT", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
        body: JSON.stringify({ contentType: pendingType, data: pendingData })
      });
      if (!r.ok) throw new Error("HTTP " + r.status);
      pendingData = null; show($("save"), false); show($("remove"), true);
      refreshAvatar(); setMsg("Saved. Your picture is updated.", "ok");
    } catch (e) { setMsg("Upload failed: " + e.message, "err"); }
    finally { $("save").disabled = false; }
  });

  $("remove").addEventListener("click", async function () {
    $("remove").disabled = true; setMsg("Removing…");
    try {
      var r = await fetch(REALM_URL + "/avatar/me", { method: "DELETE", headers: { "Authorization": "Bearer " + token } });
      if (!r.ok && r.status !== 204) throw new Error("HTTP " + r.status);
      $("avatar").removeAttribute("src"); $("avatar").classList.add("placeholder"); $("avatar").textContent = "?";
      show($("remove"), false); setMsg("Picture removed.", "ok");
    } catch (e) { setMsg("Remove failed: " + e.message, "err"); }
    finally { $("remove").disabled = false; }
  });

  (async function init() {
    try {
      var params = new URLSearchParams(location.search);
      var code = params.get("code");
      if (code) {
        token = await exchange(code);
        history.replaceState({}, "", REDIRECT); // strip ?code
      }
      if (!token) { await login(); return; }
      userId = decodeSub(token);
      show($("loading"), false); show($("ui"), true); show($("remove"), true);
      refreshAvatar();
    } catch (e) {
      show($("loading"), false); show($("ui"), true);
      setMsg("Sign-in failed. Reload to try again.", "err");
    }
  })();
})();
</script>
</body>
</html>
